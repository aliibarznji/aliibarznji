<svg width="1100" height="330" viewBox="0 0 1100 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1100" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="330" rx="24" fill="url(#sky)"/>
  <rect x="1" y="1" width="1098" height="328" rx="23" stroke="#00D4FF" stroke-opacity=".22"/>

  <g opacity=".55">
    <circle cx="88" cy="62" r="2" fill="#CFFAFE"/>
    <circle cx="176" cy="36" r="1.6" fill="#CFFAFE"/>
    <circle cx="294" cy="76" r="1.8" fill="#CFFAFE"/>
    <circle cx="415" cy="44" r="1.4" fill="#CFFAFE"/>
    <circle cx="552" cy="72" r="2" fill="#CFFAFE"/>
    <circle cx="742" cy="42" r="1.5" fill="#CFFAFE"/>
    <circle cx="914" cy="70" r="1.8" fill="#CFFAFE"/>
    <circle cx="1008" cy="38" r="1.4" fill="#CFFAFE"/>
