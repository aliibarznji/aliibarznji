  <g transform="translate(44 114)">
    <rect width="214" height="54" rx="15" fill="#0D1117" stroke="#26364F"/>
    <text x="18" y="23" fill="#94A3B8" font-size="12" font-family="Arial, sans-serif" font-weight="700">CURRENT QUEST</text>
    <text x="18" y="43" fill="#F8FAFC" font-size="16" font-family="Arial, sans-serif" font-weight="900">Build. Test. Deploy.</text>
