    <rect x="42" y="6" width="108" height="32" rx="8" fill="#142033" stroke="#26364F"/>
    <rect x="320" y="6" width="108" height="32" rx="8" fill="#142033" stroke="#26364F"/>
    <rect x="600" y="6" width="108" height="32" rx="8" fill="#142033" stroke="#26364F"/>
    <rect x="850" y="6" width="108" height="32" rx="8" fill="#142033" stroke="#26364F"/>
    <text x="70" y="28" fill="#00D4FF" font-size="14" font-family="Arial, sans-serif" font-weight="800">UI</text>
    <text x="348" y="28" fill="#A78BFA" font-size="14" font-family="Arial, sans-serif" font-weight="800">API</text>
    <text x="626" y="28" fill="#34D399" font-size="14" font-family="Arial, sans-serif" font-weight="800">DB</text>
    <text x="876" y="28" fill="#FACC15" font-size="14" font-family="Arial, sans-serif" font-weight="800">DEPLOY</text>
