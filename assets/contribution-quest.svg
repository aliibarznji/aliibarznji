    <text x="18" y="44" fill="#FFFFFF" font-size="20" font-family="Arial, sans-serif" font-weight="900">FULL STACK</text>
    <rect x="126" y="20" width="74" height="14" rx="7" fill="#1E293B"/>
    <rect x="126" y="20" width="56" height="14" rx="7" fill="url(#neon)">
      <animate attributeName="width" values="32;70;56;70;32" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(50 220)">
